# Configuración de hypr-win.
# Se busca primero el argumento de línea de comandos, luego config.toml junto al
# ejecutable y por último en el directorio actual.

# Atajos: "Modificadores+Tecla, acción, argumento".
# Modificadores: Super (Win), Shift, Ctrl, Alt.
# Acciones: exec <comando>, close, focus <left|right|up|down>,
#           move <left|right|up|down>, workspace <1-9|next|prev>, movetoworkspace <1-9|next|prev>,
#           cycle <next|prev>,
#           fullscreen, togglelayout, launcher, panel, menu, quit,
#           none (traga el atajo: sirve para anular combinaciones de Windows, p. ej. Win+S)
binds = [
    "Super+Return, exec, wt.exe",
    "Super+Q, close",
    "Super+Left, focus, left",
    "Super+Right, focus, right",
    "Super+Up, focus, up",
    "Super+Down, focus, down",
    "Super+Shift+Left, move, left",
    "Super+Shift+Right, move, right",
    "Super+Shift+Up, move, up",
    "Super+Shift+Down, move, down",
    "Super+F, fullscreen",
    "Super+Space, menu",
    "Super+Shift+Space, togglelayout",
    "Super+Tab, cycle, next",
    "Super+Shift+Tab, cycle, prev",
    "Super+Ctrl+Right, workspace, next",
    "Super+Ctrl+Left, workspace, prev",
    "Super+Ctrl+Shift+Right, movetoworkspace, next",
    "Super+Ctrl+Shift+Left, movetoworkspace, prev",
    "Super+K, launcher",
    "Super+D, launcher",
    "Super+I, panel",
    "Super+Shift+E, quit",
    "Super+S, none",
    "Super+W, none",
    "Super+A, none",
    "Super+N, none",
    "Super+C, none",
    "Super+Z, none",
    "Super+1, workspace, 1",
    "Super+2, workspace, 2",
    "Super+3, workspace, 3",
    "Super+4, workspace, 4",
    "Super+5, workspace, 5",
    "Super+6, workspace, 6",
    "Super+7, workspace, 7",
    "Super+8, workspace, 8",
    "Super+9, workspace, 9",
    "Super+Shift+1, movetoworkspace, 1",
    "Super+Shift+2, movetoworkspace, 2",
    "Super+Shift+3, movetoworkspace, 3",
    "Super+Shift+4, movetoworkspace, 4",
    "Super+Shift+5, movetoworkspace, 5",
    "Super+Shift+6, movetoworkspace, 6",
    "Super+Shift+7, movetoworkspace, 7",
    "Super+Shift+8, movetoworkspace, 8",
    "Super+Shift+9, movetoworkspace, 9",
]

[general]
layout = "dwindle"     # "dwindle" | "master"
workspaces = 9         # 1..=9
gaps_in = 8            # px entre ventanas
gaps_out = 8           # px entre ventanas y el borde del área de trabajo
master_ratio = 0.55    # fracción del ancho para la ventana master (layout master)
animation_ms = 180     # duración de las animaciones; 0 las desactiva
focus_follows_mouse = true  # el foco sigue al ratón, sin hacer clic
disable_windows_animations = false  # apaga la animación de minimizar/maximizar mientras corre (se restaura al salir)
hide_taskbar = true    # oculta la barra de tareas de Windows (se restaura al salir; ver --restore-taskbar)
block_start_menu = true  # la tecla Win sola ya no abre el menú Inicio (Win+R sigue funcionando)

[bar]
# Estilo macOS. La barra y el lanzador (Super+K) comparten estos colores y la fuente.
# Modo oscuro (por defecto):
#   background "#1e1e20"  foreground "#f5f5f7"  dim "#8e8e93"  accent "#0a84ff"  accent_text "#ffffff"
# Modo claro:
#   background "#f2f2f7"  foreground "#1d1d1f"  dim "#86868b"  accent "#007aff"  accent_text "#ffffff"
height = 28            # px a 96 DPI (se escala con el DPI del sistema)
opacity = 80           # % de opacidad de la barra (20-100); más bajo = más translúcida
background = "#1e1e20"
foreground = "#f5f5f7"
dim = "#8e8e93"        # workspaces vacíos y textos secundarios
accent = "#0a84ff"     # pastilla del workspace activo y selección del lanzador
accent_text = "#ffffff"
font = "Segoe UI Variable Text"   # lo más parecido a San Francisco en Windows 11 (si no está, Segoe UI)
font_size = 10         # puntos

[dock]
# Dock estilo macOS, centrado abajo en cada monitor. Reserva su espacio (el mosaico no lo tapa).
enabled = true
icon_size = 36         # px a 96 DPI
magnification = 1.5    # escala del icono bajo el cursor; 1.0 la desactiva
autohide = true        # se oculta cuando hay ventanas en el monitor; aparece al dejar el ratón en el borde inferior
show_running = true    # añade las apps abiertas que no están fijadas
# Apps fijadas, por nombre (búsqueda difusa en la lista de aplicaciones; usa los nombres de tu idioma).
pinned = ["Explorador", "Edge", "Terminal", "Configuración", "Calculadora"]
